<!DOCTYPE html>
<html lang="zh-CN">
<head>
  {{- partial "head.html" . -}}
</head>
<body>
  {{- if .IsHome -}}
  {{- partial "notice.html" . -}}
  {{- end -}}
  {{- partial "header.html" . -}}
  <main class="main">
    {{- block "main" . }}{{- end }}
  </main>
  {{- partial "footer.html" . -}}
  <script src="{{ "js/header-scroll.js" | relURL }}" defer></script>
  <script src="{{ "js/lang-switch.js" | relURL }}" defer></script>
  <script src="{{ "js/theme.js" | relURL }}" defer></script>
  {{- if .IsHome -}}
  <script src="{{ "js/notice.js" | relURL }}" defer></script>
  {{- end -}}
</body>
</html>
