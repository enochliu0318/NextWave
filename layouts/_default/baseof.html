<!DOCTYPE html>
<html lang="zh-CN">
<head>
  {{- partial "head.html" . -}}
</head>
<body>
  {{- partial "header.html" . -}}
  <main class="main">
    {{- block "main" . }}{{- end }}
  </main>
  {{- partial "footer.html" . -}}

  {{/* Search overlay */}}
  <div class="search-overlay" id="searchOverlay">
    <div class="search-modal" role="dialog" aria-label="搜索">
      <div class="search-input-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" class="search-input" id="searchInput" placeholder="搜索文章标题、作者、内容…" autocomplete="off">
        <button class="search-close" id="searchClose" aria-label="关闭搜索">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="search-results" id="searchResults"></div>
      <div class="search-hint">按 <kbd>ESC</kbd> 关闭 · <kbd>↑</kbd> <kbd>↓</kbd> 导航</div>
    </div>
  </div>

  <script src="{{ "js/search.js" | relURL }}"></script>
</body>
</html>
