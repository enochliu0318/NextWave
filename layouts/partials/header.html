{{ $i18n := .Site.Data.i18n }}
<header class="site-header">
  <div class="container header-inner">
    <div class="header-top">
      <a href="{{ "/" | relURL }}" class="site-brand">
        <span class="site-name">后浪</span>
        <span class="site-name-en">NextWave</span>
      </a>
      <div class="header-actions">
        {{ if .Site.Params.enableSearch }}
        <button type="button" class="search-trigger-compact" data-search-open
                aria-label="搜索文章" data-i18n-en-label="{{ index $i18n "search_open" }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
        {{ end }}
        <button type="button" class="nav-toggle" aria-controls="site-nav" aria-expanded="false" aria-label="打开导航菜单" data-i18n-en-label="{{ index $i18n "nav_toggle_label" }}">
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </button>
      </div>
    </div>
    <nav class="site-nav" id="site-nav">
      {{ range .Site.Menus.main }}
      {{/* 次级分组（投稿/关于等）与主栏目之间画一条分隔线，只在分组第一项前显示 */}}
      {{ if .Params.secondary }}<span class="nav-divider" aria-hidden="true"></span>{{ end }}
      <a href="{{ .URL | relURL }}" class="nav-link{{ if $.IsMenuCurrent "main" . }} active{{ end }}"{{ with .Params.i18n }} data-i18n-en="{{ index $i18n . }}"{{ end }}>{{ .Name }}</a>
      {{ end }}
      {{ if .Site.Params.enableSearch }}
      <button type="button" class="search-trigger" data-search-open
              aria-label="搜索文章" data-i18n-en-label="{{ index $i18n "search_open" }}">
        <svg class="search-trigger-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span class="search-trigger-text" data-i18n-en="{{ index $i18n "search_open" }}">搜索文章</span>
        <kbd class="search-trigger-kbd">/</kbd>
      </button>
      {{ end }}
      <button type="button" id="lang-switch" class="lang-switch" data-target-lang="en" aria-label="切换到英文">EN</button>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="切换到深色模式" title="切换深浅色">
        <svg class="theme-toggle-icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg class="theme-toggle-icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </nav>
  </div>
</header>
