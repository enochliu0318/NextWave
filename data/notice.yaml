# 首页通知弹窗配置
# ------------------------------------------------------------
# enabled：是否显示通知。不想显示时改成 false 即可，无需删除内容。
# version：通知的版本号，可自由填写（数字/日期/字符串均可）。
#          每次更新 title 或 body 后，请把 version 改成一个新的值
#          （例如改成当天日期 "2026-08-10"），这样即使访客之前
#          关闭过旧通知，也会重新看到这次的新内容；如果只是想
#          让已经看过的人不再重复看到，则不要改动 version。
# title：通知标题，一行简短文字即可。
# body：通知正文，支持多段落——段落之间用一个空行分隔。
# button_text：关闭按钮上的文字。
# ------------------------------------------------------------
# button_text_en：可选。若希望关闭按钮的英文文案与默认翻译不同，
#                 取消注释并填写；不填则自动使用英文默认文案「Got it」。
enabled: true
version: "2026-08-07v2"
title: "重大更新：双语内容上线"
body: |
  后浪NextWave网站为了面向更多青少年作者和读者，开始了走向国际的第一步，设置双语内容。

  欢迎各位同学们，叔叔阿姨们投稿，分享你们的诗歌、散文、小说、纪实文章等各种题材的内容。详情请点击「投稿」了解投稿方式。

  我们也在持续招募新成员加入管理运营团队，欢迎点击「关于」了解详情。
button_text: "好的"
# button_text_en: "Got it"
