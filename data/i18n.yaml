# 站点界面文案的英文翻译词典
# ------------------------------------------------------------
# 仅用于「导航栏 / 按钮 / 页脚」等界面文案的中英切换，
# 文章正文内容不受此文件影响，任何语言下都保持中文原文。
#
# 使用方式：访客点击导航栏右侧的 EN/中 按钮时，页面上带有
# 对应标记的文字会被替换成这里配置的英文；改动这里的值即可
# 调整显示的英文文案，无需改动模板代码。
# ------------------------------------------------------------

# 导航菜单
nav_home: "Home"
nav_poetry: "Poetry"
nav_prose: "Prose"
nav_fiction: "Fiction"
nav_nonfiction: "Non-fiction"
nav_submit: "Submit"
nav_about: "About"
nav_toggle_label: "Open navigation menu"

# 搜索（头部搜索框按钮 + 弹出面板 + /search/ 独立页）
# 注：面板里随输入动态变化的文案（“查看全部结果 →”“没有找到…”等）
#     在 static/js/search.js 顶部的 I18N 表里维护，改这里不生效
nav_search: "Search"
search_open: "Search articles"
search_close: "Close search"
search_close_label: "Close"
search_clear: "Clear input"
search_open_page: "Go to search page →"

# 首页 / 列表页
read_more: "Read more →"
back_to_prefix: "← Back to "
empty_state: "No articles yet — stay tuned."

# 页脚
footer_built_by: "Built by"
footer_search: "Search the site"
footer_col_sections: "Sections"
footer_col_explore: "Explore"
footer_works: "works"
footer_rss: "RSS feed"
footer_changelog: "Changelog"

# 首页通知弹窗的默认按钮文案
# （若 data/notice.yaml 中设置了 button_text_en，会优先使用那个值）
notice_default_button: "Got it"

# 站点标语 / 简介（首页大标题下方 + 页脚共用）
site_slogan: "Waves of faith, the voice of youth"
site_description: "A literary platform for teens — poetry, prose, and fiction that carry the voice of youth."